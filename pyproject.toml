[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pec-mcp-server"
version = "0.1.0"
description = "Servidor MCP somente leitura para dados clínicos do PEC"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "mcp[cli]<2",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
]

[project.scripts]
pec-mcp = "pec_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
